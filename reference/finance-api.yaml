paths:
  /api/v1/auth/register:
    post:
      tags:
        - Authentication
      summary: Register a new user
      description: Registers a new user with the provided details.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - email
                - name
                - password
                - username
              properties:
                email:
                  type: string
                  format: email
                name:
                  type: string
                password:
                  type: string
                username:
                  type: string
          application/json:
            schema:
              type: object
              required:
                - email
                - name
                - password
                - username
              properties:
                email:
                  type: string
                  format: email
                name:
                  type: string
                password:
                  type: string
                username:
                  type: string
      responses:
        "201":
          description: User created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: User created successfully
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                        example: 8102abc8-0fe0-484b-bf93-f81ec03bee7d
                      name:
                        type: string
                        example: Test User4
                      email:
                        type: string
                        format: email
                        example: test4@example.com
                      username:
                        type: string
                        example: testuser4
                      created_at:
                        type: string
                        format: date-time
                        example: 2025-10-17T20:41:52.0498127Z
                      created_by:
                        type: string
                        nullable: true
                        example: null
                      updated_at:
                        type: string
                        format: date-time
                        example: 2025-10-17T20:41:52.0498127Z
                      updated_by:
                        type: string
                        nullable: true
                        example: null
                  meta:
                    type: object
                    properties:
                      version:
                        type: string
                        example: v1.0.0
                      timestamp:
                        type: integer
                        example: 1760733712
  /api/v1/auth/login:
    post:
      tags:
        - Authentication
      summary: Login to the application
      description: Authenticates the user and returns access and refresh tokens.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - email_or_username
                - password
              properties:
                email_or_username:
                  type: string
                password:
                  type: string
          application/json:
            schema:
              type: object
              required:
                - email_or_username
                - password
              properties:
                email_or_username:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: Successful authentication
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Login successful
                  data:
                    type: object
                    properties:
                      access_token:
                        type: string
                        description: JWT access token for authenticated requests
                        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VyX2lkIjoiMjg3OGQyNDYtZWY3Ny00YTI5LWIzOTgtZGM1MmJiMzIyNGEwIiwiZW1haWwiOiJlY2hvdGVjaG5vMDA3QGdtYWlsLmNvbSIsInVzZXJuYW1lIjoiYWRtaW4iLCJleHAiOjE3NjA4MjA4NDYsImlhdCI6MTc2MDczNDQ0Nn0.NhQvaZR9b9lSRGorBDr4SJoShHcr5jey1dF6eHqPrro
                      refresh_token:
                        type: string
                        description: JWT refresh token for obtaining new access tokens
                        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VyX2lkIjoiMjg3OGQyNDYtZWY3Ny00YTI5LWIzOTgtZGM1MmJiMzIyNGEwIiwiZW1haWwiOiJlY2hvdGVjaG5vMDA3QGdtYWlsLmNvbSIsInVzZXJuYW1lIjoiYWRtaW4iLCJleHAiOjE3NjEzMzkyNDYsImlhdCI6MTc2MDczNDQ0Nn0.VfxQ4FQv80XgcHySp1CVs9l-jkyb6-QL-UHP-b_Kc84
                      user:
                        type: object
                        properties:
                          id:
                            type: string
                            format: uuid
                            example: 2878d246-ef77-4a29-b398-dc52bb3224a0
                          name:
                            type: string
                            example: Jane Doe
                          email:
                            type: string
                            format: email
                            example: janedoe@gmail.com
                          username:
                            type: string
                            example: admin
                          created_at:
                            type: string
                            format: date-time
                            example: 2025-10-17T00:00:00Z
                          created_by:
                            type: string
                            nullable: true
                            example: null
                          updated_at:
                            type: string
                            format: date-time
                            example: 2025-10-17T00:00:00Z
                          updated_by:
                            type: string
                            nullable: true
                            example: null
                  meta:
                    type: object
                    properties:
                      version:
                        type: string
                        example: v1.0.0
                      timestamp:
                        type: integer
                        example: 1760734446
        "401":
          description: Unauthorized, invalid credentials
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: Unauthorized
                  message:
                    type: string
                    example: invalid login credentials
                  data:
                    type: object
                    nullable: true
                  meta:
                    type: object
                    nullable: true
                  errors:
                    type: object
                    properties:
                      password:
                        type: string
                        example: Invalid username or password
                      username:
                        type: string
                        example: Invalid username or password
  /api/v1/auth/logout:
    post:
      tags:
        - Authentication
      summary: Logout the user
      description: Logs out the user by invalidating the current session token.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Successful logout
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: OK
                  message:
                    type: string
                    example: success
                  data:
                    type: object
                    nullable: true
                    example: null
        "401":
          description: Unauthorized, missing or invalid token
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: Unauthorized
                  message:
                    type: string
                    example: unauthorized
                  data:
                    type: object
                    nullable: true
                    example: null
                  meta:
                    type: object
                    nullable: true
                    example: null
                  errors:
                    type: object
                    nullable: true
                    example: null
  /api/v1/auth/refresh:
    post:
      tags:
        - Authentication
      summary: Refresh Access Token
      description: Allows a user to refresh their access token using a refresh token.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
                  description: The refresh token required to obtain a new access token.
              required:
                - refresh_token
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
                  description: The refresh token required to obtain a new access token.
              required:
                - refresh_token
      responses:
        "200":
          description: Successfully refreshed the token
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: OK
                  message:
                    type: string
                    example: Token refreshed
                  data:
                    type: object
                    properties:
                      access_token:
                        type: string
                        description: The new access token for authenticated requests.
                      expired_at:
                        type: string
                        format: date-time
                        description: The expiration date and time of the new access token.
                      refresh_token:
                        type: string
                        description: A new refresh token if the previous one has been rotated.
                      refreshable_until:
                        type: string
                        format: date-time
                        description: The last date and time the refresh token can be used.
                  meta:
                    type: object
                    nullable: true
                    example: null
                  errors:
                    type: object
                    nullable: true
                    example: null
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: Bad Request
                  message:
                    type: string
                    example: invalid token
                  data:
                    type: object
                    nullable: true
                    example: null
                  meta:
                    type: object
                    nullable: true
                    example: null
                  errors:
                    type: object
                    example: null
                    nullable: true
